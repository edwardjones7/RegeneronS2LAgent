      bariatric_surgery: "¿Alguna vez ha tenido una cirugía para bajar de peso, como un bypass gástrico, una manga o una banda, incluida una cirugía para revisarla o quitarla?"
      pancreas_gallbladder: "¿Alguna vez ha tenido pancreatitis, inflamación de la vesícula biliar o cálculos en la vesícula que le causaron síntomas?"
      thyroid_cancer_history: "Última pregunta. ¿Usted o alguien de su familia ha tenido un tipo raro de cáncer de tiroides llamado cáncer medular de tiroides, o una condición llamada MEN 2?"
