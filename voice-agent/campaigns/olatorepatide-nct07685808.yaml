    first_message: "Hola {{first_name}}, soy Ava, una asistente automatizada del equipo de investigación de Regeneron. Le informo que esta llamada se graba. Usted pidió información sobre nuestro estudio de control de peso. ¿Tiene un minuto?"
    one_liner: "Es un estudio de investigación que prueba un medicamento experimental para el control del peso en adultos con sobrepeso u obesidad que no tienen diabetes."
    voicemail: "Hola, soy Ava, una asistente automatizada del equipo de investigación de Regeneron, devolviendo su solicitud. Intentaremos llamarle más tarde. Que tenga un buen día."
    facts:
      - "El estudio prueba un medicamento experimental llamado olatorepatide."
      - "Olatorepatide pertenece a la familia de medicamentos GLP-1 y GIP."
      - "El estudio es para adultos de 18 años o más con sobrepeso u obesidad que no tienen diabetes."
      - "Es un estudio de Fase 2: todavía se está evaluando la seguridad del medicamento y qué tan bien funciona."
      - "Algunas personas recibirán un placebo, es decir, una sustancia inactiva de apariencia similar, asignado al azar."
