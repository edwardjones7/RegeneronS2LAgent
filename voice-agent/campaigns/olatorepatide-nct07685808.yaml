# DEMO CAMPAIGN: NOT IRB-APPROVED.
# Study facts come from the public ClinicalTrials.gov record NCT07685808
# (snapshot: campaigns/sources/NCT07685808.json). Anything marked `source: demo` is
# made-up demo data, not real study information.

id: olatorepatide-nct07685808
demo_not_irb_approved: true
nct_id: NCT07685808
study_url: https://clinicaltrials.gov/study/NCT07685808
sponsor: Regeneron Pharmaceuticals

clinic_name: Regeneron
team_name: the Regeneron research team
clinic_address: "100 Research Way, Tarrytown, NY (demo address)"
clinic_phone: "+18568340605"   # number patients call for questions / rescheduling (demo: coordinator)
coordinator_name: Jordan Patel  # demo coordinator
coordinator_phone: "+18568340605"  # coordinator (must be Twilio-verified on a trial account)
timezone: America/New_York
calling_hours:
  start: "09:00"
  end: "20:00"
visit_length_minutes: 60

agent_name: Ava
study_short_name: weight management
one_liner: >-
  It's a research study testing an experimental weight-management medication for adults
  living with overweight or obesity who don't have diabetes.

# The ONLY things Ava may say about the study. Anything else: "the research team will follow up."
approved_facts:
  - fact: The study is testing an experimental medication called olatorepatide.
    source: ctgov
  - fact: Olatorepatide is in the GLP-1 and GIP family of medicines; it acts on both of those hormone receptors.
    source: ctgov
  - fact: The study is for adults 18 or older living with overweight or obesity who do not have diabetes.
    source: ctgov
  - fact: It is a Phase 2 study, which means the medication is still being tested for safety and how well it works.
    source: ctgov
  - fact: Some participants will receive a placebo, which is an inactive look-alike, instead of the study medication. Participants are assigned by chance.
    source: ctgov
  - fact: Neither participants nor the study team will know who is getting the study medication versus placebo during the study.
    source: ctgov
  - fact: Participation lasts about 60 weeks, a little over a year.
    source: ctgov
  - fact: The study is looking at side effects, how the body processes the medication, and changes in body weight.
    source: ctgov
  - fact: The study plans to enroll about 360 people at sites across the United States.
    source: ctgov
  - fact: Sponsored by Regeneron Pharmaceuticals.
    source: ctgov
  - fact: The first visit is a screening visit of about an hour, where the research team checks whether the study is a good fit. It's free.
    source: demo
  - fact: Taking part is completely voluntary and you can stop at any time.
    source: demo

# Pre-screen questions, asked in this order. The backend decides fit, never the agent.
# kinds: number (age), height, weight, yes_no
# role: disqualify_if_yes -> "yes" ends the screen as not a fit
#       comorbidity       -> needed only when BMI is 27 to under 30
#       unsure_flags      -> "not sure" is flagged instead of blocking
prescreen_questions:
  # Each question maps to a key criterion from the public record (`criterion`), so the
  # dashboard can show why a question was asked. "Other protocol-defined criteria apply":
  # the research team makes the final eligibility call at the screening visit.
  - id: age
    kind: number
    ask: "First, how old are you?"
    min: 18
    criterion: "Adults 18 years or older"
  - id: height
    kind: height
    ask: "How tall are you?"
    criterion: "Inclusion: BMI 30.0 to under 45.0, or BMI 27.0 or more with a weight-related condition"
  - id: weight
    kind: weight
    ask: "And about how much do you weigh right now?"
    criterion: "Inclusion: BMI 30.0 to under 45.0, or BMI 27.0 or more with a weight-related condition"
  - id: comorbidity
    kind: yes_no
    role: comorbidity
    only_if: bmi_27_to_30
    ask: "Has a doctor ever told you that you have any of these: high blood pressure, high cholesterol, prediabetes, sleep apnea, heart disease or heart failure, or a stroke or other blood vessel disease in the brain?"
    criterion: "Inclusion (BMI 27 to under 30): hypertension, dyslipidemia, prediabetes, obstructive sleep apnea, coronary artery disease, heart failure, or cerebrovascular disease"
  - id: diabetes
    kind: yes_no
    role: disqualify_if_yes
    ask: "Have you ever been diagnosed with type 1 or type 2 diabetes?"
    criterion: "Exclusion: previous or current diagnosis of type 1 or type 2 diabetes"
  - id: weight_change
    kind: yes_no
    role: disqualify_if_yes
    ask: "In about the last three months, has your weight gone up or down by more than eleven pounds, that's five kilograms?"
    criterion: "Exclusion: body weight change of more than 5 kg in about 3 months before screening"
  - id: bariatric_surgery
    kind: yes_no
    role: disqualify_if_yes
    ask: "Have you ever had weight-loss surgery, like a gastric bypass, sleeve, or band, including any surgery to revise or remove one?"
    criterion: "Exclusion: bariatric surgery, including revision, reversal or removal procedures"
  - id: pancreas_gallbladder
    kind: yes_no
    role: disqualify_if_yes
    ask: "Have you ever had pancreatitis, an inflamed gallbladder, or gallstones that caused symptoms?"
    criterion: "Exclusion: history of acute or chronic pancreatitis, cholecystitis, or symptomatic gallbladder stones"
  - id: thyroid_cancer_history
    kind: yes_no
    role: disqualify_if_yes
    unsure_flags: true
    ask: "Last one. Have you, or has anyone in your family, had a rare thyroid cancer called medullary thyroid cancer, or a condition called MEN 2?"
    criterion: "Exclusion: personal or family history of medullary thyroid carcinoma or multiple endocrine neoplasia type 2"

bmi_rules:
  fit_min: 30.0
  fit_max_exclusive: 45.0
  comorbidity_min: 27.0

