      - "La participación dura unas 60 semanas, un poco más de un año."
      - "El estudio planea incluir a unas 360 personas en centros de Estados Unidos."
      - "El patrocinador es Regeneron Pharmaceuticals."
      - "La primera visita es una visita de evaluación de aproximadamente una hora, y es gratuita. (dato de demostración)"
