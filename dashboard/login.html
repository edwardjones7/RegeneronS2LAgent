<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Me Maybe · Sign in</title>
<link rel="stylesheet" href="/dashboard/static/app.css">
</head>
<body>
<div class="login">
  <form class="card" method="post" action="/dashboard/login">
    <div class="logo" style="padding:0 0 8px"><span class="logo-mark"><svg class="i" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>Call Me Maybe</div>
    <p class="muted" style="margin:0">Research coordinator dashboard</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <input type="hidden" name="next" id="next" value="/dashboard">
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('next')) document.getElementById('next').value = q.get('next');
  if (q.get('error')) document.getElementById('err').textContent = 'Wrong password. Try again.';
</script>
</body>
</html>
