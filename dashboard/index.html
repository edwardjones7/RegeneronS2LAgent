<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Me Maybe · Coordinator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/static/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
  <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
  <symbol id="hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></symbol>
  <symbol id="msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></symbol>
  <symbol id="ext" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></symbol>
  <symbol id="form" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
</svg>

<div class="app">
  <aside>
    <div class="logo"><span class="logo-mark"><svg class="i"><use href="#phone"/></svg></span>Call Me Maybe</div>
    <nav class="nav" id="campaignNav" aria-label="Campaigns"><div class="nav-label">Campaigns</div></nav>
    <nav class="nav" aria-label="Tools">
      <div class="nav-label">Tools</div>
      <button onclick="window.open('/demo','_blank')"><svg class="i"><use href="#form"/></svg>Demo opt-in form</button>
    </nav>
    <div class="side-foot">
      <div class="demo-flag" id="demoFlag" hidden><b>Demo.</b> Study wording is based on public ClinicalTrials.gov data and is <b>not IRB-approved</b>.</div>
      <form method="post" action="/dashboard/logout"><button class="logout" style="width:100%" type="submit">Sign out</button></form>
    </div>
  </aside>

  <main id="main">
    <div class="topbar">
      <div>
        <div class="crumbs" id="crumbs">Campaigns</div>
        <h1 id="title">Loading…</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn" href="/demo" target="_blank" rel="noopener"><svg class="i"><use href="#phone"/></svg>New test lead</a>
      </div>
    </div>

    <section class="kpis" id="kpis" aria-label="Campaign numbers"></section>

    <section class="card" aria-labelledby="outcomesH">
      <div class="card-h"><h2 id="outcomesH">Where every lead stands</h2><span class="muted" style="font-size:13px" id="totalLeads"></span></div>
      <div class="funnel" id="funnel" role="img"></div>
      <div class="legend" id="legend"></div>
    </section>

    <div class="grid2">
      <section class="card" aria-label="Leads">
        <div class="filters" id="filters"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Lead</th><th class="hide-sm">Opted in</th><th>Called in</th><th>Status</th><th class="hide-sm">Attempts</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="empty" id="rowsEmpty" hidden>No leads here yet.</div>
      </section>

      <section class="card" aria-labelledby="attnH">
        <div class="card-h"><h2 id="attnH">Needs your attention</h2><span class="badge b-warn" id="attnCount">0</span></div>
        <div class="attn" id="attn"></div>
      </section>
    </div>

    <section class="card detail" id="detail" hidden aria-live="polite"></section>
  </main>
</div>
<script src="/dashboard/static/app.js"></script>
</body>
</html>
